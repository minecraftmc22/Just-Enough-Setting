<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6DFF"/>
      <stop offset="0.52" stop-color="#6143E6"/>
      <stop offset="1" stop-color="#37209F"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#17142A" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#0A0816" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6C7FF"/>
      <stop offset="1" stop-color="#9C7BFF"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="1024" height="1024" rx="232" ry="232"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#gloss)"/>

    <rect x="150" y="216" width="724" height="592" rx="76" fill="url(#card)"
          stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4"/>

    <!-- 三行文字，每行左侧一个拖拽手柄；中间那行被拎起来，右移并带阴影 -->
    <g fill="#FFFFFF" fill-opacity="0.34">
      <g id="h1">
        <circle cx="232" cy="316" r="6"/><circle cx="256" cy="316" r="6"/>
        <circle cx="232" cy="340" r="6"/><circle cx="256" cy="340" r="6"/>
        <circle cx="232" cy="364" r="6"/><circle cx="256" cy="364" r="6"/>
      </g>
      <g id="h2">
        <circle cx="232" cy="458" r="6"/><circle cx="256" cy="458" r="6"/>
        <circle cx="232" cy="482" r="6"/><circle cx="256" cy="482" r="6"/>
        <circle cx="232" cy="506" r="6"/><circle cx="256" cy="506" r="6"/>
      </g>
      <g id="h3">
        <circle cx="232" cy="600" r="6"/><circle cx="256" cy="600" r="6"/>
        <circle cx="232" cy="624" r="6"/><circle cx="256" cy="624" r="6"/>
        <circle cx="232" cy="648" r="6"/><circle cx="256" cy="648" r="6"/>
      </g>
    </g>

    <rect x="300" y="300" width="478" height="60" rx="30" fill="#FFFFFF" fill-opacity="0.94"/>

    <g>
      <rect x="308" y="436" width="500" height="52" rx="26" fill="#000000" fill-opacity="0.35"
            transform="translate(0 10)"/>
      <rect x="308" y="436" width="500" height="52" rx="26" fill="url(#hl)"/>
      <rect x="308" y="436" width="500" height="52" rx="26" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
    </g>

    <rect x="300" y="584" width="382" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.40"/>

    <!-- 进度条 -->
    <rect x="300" y="700" width="430" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.16"/>
    <rect x="300" y="700" width="258" height="16" rx="8" fill="#C9B8FF"/>
    <circle cx="558" cy="708" r="24" fill="#FFFFFF"/>
  </g>
</svg>
